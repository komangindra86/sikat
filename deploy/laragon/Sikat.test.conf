# Vhost Nginx Laragon untuk SIKAT (development lokal).
# Salin ke C:\laragon\etc\nginx\sites-enabled\Sikat.test.conf (TANPA awalan "auto."
# agar tidak ditimpa Laragon), hapus auto.Sikat.test.conf, lalu reload Nginx.
#
# Aplikasi Go berjalan di 127.0.0.1:8080 (SIKAT_ADDR); Nginx meneruskan sikat.test ke sana.
# Aplikasi lain cukup memakai port berbeda (8081, 8082, ...) dan file vhost serupa.
server {
    listen 80;
    server_name sikat.test *.sikat.test;

    # Batas unggahan foto (sesuaikan dengan pengaturan upload aplikasi)
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Host asli wajib diteruskan: perlindungan CSRF membandingkan Origin dengan Host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
