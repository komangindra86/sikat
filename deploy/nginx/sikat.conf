# /etc/nginx/sites-available/sikat.conf
# Reverse proxy HTTPS untuk SIKAT. Ganti sikat.rs.example dengan domain Anda.
# Sertifikat: certbot --nginx -d sikat.rs.example (lihat docs/DEPLOYMENT.md).

server {
    listen 80;
    listen [::]:80;
    server_name sikat.rs.example;
    # Validasi Let's Encrypt, selebihnya dialihkan ke HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sikat.rs.example;

    ssl_certificate     /etc/letsencrypt/live/sikat.rs.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sikat.rs.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Foto dari HP sudah dikompres; batas sedikit di atas pengaturan upload aplikasi.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Header keamanan (CSP, HSTS, dll.) dikirim oleh aplikasi; jangan diduplikasi di sini.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Host asli wajib diteruskan: perlindungan CSRF membandingkan Origin dengan Host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Aset statis berversi (?v=hash) di-cache lama oleh aplikasi; Nginx cukup meneruskan.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
